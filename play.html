    <script>
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();

            const urlParams = new URLSearchParams(window.location.search);
            let videoId = urlParams.get('v');

            if (!videoId) {
                videoId = window.location.pathname.split('/').pop().trim();
                if (videoId === "play.html" || videoId === "index.html" || videoId === "") {
                    videoId = "";
                }
            }

            const mainPlayer = document.getElementById('mainPlayer');
            const errorMsg = document.getElementById('errorMsg');

            function showError(text) {
                mainPlayer.classList.add('hidden');
                errorMsg.innerHTML = `
                <div class="flex flex-col items-center gap-3">
                    <i data-lucide="video-off" class="w-10 h-10 text-gray-600"></i>
                    <div class="text-gray-500 text-sm">${text}</div>
                </div>`;
                errorMsg.classList.remove('hidden');
                lucide.createIcons();
            }

            if (!videoId || !/^[a-zA-Z0-9_.-]{3,80}$/.test(videoId)) {
                showError('Invalid video');
                return;
            }

            const filename = videoId.includes('.') ? videoId : videoId + '.mp4';
            const primaryUrl = 'https://cdn.videy.co/' + encodeURIComponent(filename) + '#t=0.001';
            const fallbackUrl = 'https://cdn2.videy.co/' + encodeURIComponent(filename) + '#t=0.001';

            mainPlayer.src = primaryUrl;
            mainPlayer.load();

            let fallbackAttempted = false;

            const timeout = setTimeout(() => {
                if (mainPlayer.readyState === 0 && !mainPlayer.error && !fallbackAttempted) {
                    triggerFallback();
                } else if (mainPlayer.readyState === 0 && fallbackAttempted) {
                    showError('Connection timeout');
                }
            }, 12000);

            mainPlayer.addEventListener('loadedmetadata', () => { clearTimeout(timeout); });
            mainPlayer.addEventListener('canplay', () => { clearTimeout(timeout); });

            function triggerFallback() {
                fallbackAttempted = true;
                mainPlayer.src = fallbackUrl;
                mainPlayer.load();
            }

            mainPlayer.addEventListener('error', () => {
                if (!fallbackAttempted) {
                    triggerFallback();
                    return;
                }
                clearTimeout(timeout);
                showError('Video unavailable');
            });
        });
    </script>
